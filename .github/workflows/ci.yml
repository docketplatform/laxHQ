name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run by hand: same as a push to main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run test:unit
      - run: npm run test:rules
      - run: npm run test:functions

  # Browser walk-throughs, in parallel with the other tests. A deploy waits for both.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Deploys rules, indexes and functions to the live Firebase project on every push to main
  # (the owner chose automatic deploys), or when run by hand, after ALL tests pass.
  # Needs the FIREBASE_SERVICE_ACCOUNT secret and FIREBASE_PROJECT variable.
  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_PROJECT != ''
    concurrency: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # The functions need these secrets to exist before they can deploy. Create any that are
      # missing, and give any without a value a random placeholder. Secrets that already have
      # a value are never changed. Add real values in Google Cloud → Secret Manager → New version.
      - name: Make sure Google services and secrets are ready
        env:
          CLOUDSDK_CORE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          # Google services the Firebase deploy checks before it starts (safe to repeat).
          gcloud services enable secretmanager.googleapis.com cloudbilling.googleapis.com cloudresourcemanager.googleapis.com iam.googleapis.com --quiet
          for s in ANTHROPIC_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET REVENUECAT_WEBHOOK_AUTH; do
            if ! gcloud secrets describe "$s" >/dev/null 2>&1; then
              gcloud secrets create "$s" --replication-policy=automatic --quiet
              echo "Created secret $s"
            fi
            if [ -z "$(gcloud secrets versions list "$s" --filter='state=ENABLED' --limit=1 --format='value(name)')" ]; then
              printf 'placeholder-%s' "$(openssl rand -hex 16)" | gcloud secrets versions add "$s" --data-file=- --quiet
              echo "::warning::$s had no value, so it got a placeholder. Add the real value in Secret Manager (New version)."
            else
              echo "$s already has a value; left unchanged"
            fi
          done
      - run: npx firebase deploy --project "${{ vars.FIREBASE_PROJECT }}" --only firestore,storage,functions --non-interactive --force
      - name: Load starter data (config rewritten from the repo; schools merged)
        run: npm run seed
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT }}
