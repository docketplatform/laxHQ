name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run by hand to deploy (see the deploy job)
    inputs:
      seed:
        description: Also load the starter data (NCAA rules, checklist, plans, school list)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run test:rules
      - run: npm run test:functions
      - run: npm run test:e2e

  # Deploys rules, indexes and functions to the (single, live) Firebase project.
  # Only when run by hand from the Actions tab, after every test passes, and once the
  # FIREBASE_SERVICE_ACCOUNT secret and FIREBASE_PROJECT variable are set.
  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # The functions need these secrets to exist before they can deploy. Create any that are
      # missing, and give any without a value a random placeholder. Secrets that already have
      # a value are never changed. Add real values in Google Cloud → Secret Manager → New version.
      - name: Make sure the secrets exist
        env:
          CLOUDSDK_CORE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          gcloud services enable secretmanager.googleapis.com --quiet
          for s in ANTHROPIC_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET REVENUECAT_WEBHOOK_AUTH; do
            if ! gcloud secrets describe "$s" >/dev/null 2>&1; then
              gcloud secrets create "$s" --replication-policy=automatic --quiet
              echo "Created secret $s"
            fi
            if [ -z "$(gcloud secrets versions list "$s" --filter='state=ENABLED' --limit=1 --format='value(name)')" ]; then
              printf 'placeholder-%s' "$(openssl rand -hex 16)" | gcloud secrets versions add "$s" --data-file=- --quiet
              echo "::warning::$s had no value, so it got a placeholder. Add the real value in Secret Manager (New version)."
            else
              echo "$s already has a value; left unchanged"
            fi
          done
      - run: npx firebase deploy --project "${{ vars.FIREBASE_PROJECT }}" --only firestore,storage,functions --non-interactive --force
      - name: Load starter data
        if: inputs.seed
        run: npm run seed
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT }}
